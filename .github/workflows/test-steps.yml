name: Test Steps
on:
  workflow_dispatch

jobs:
  test-step:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Node checks
        uses: ./.github/actions/project-ci
        with:
          node-version: 24
          stack: node

          
# ✅ ADD THIS STEP FOR GITHUB APP TEST
      - name: Test GitHub App
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          npm install jsonwebtoken node-fetch

          echo "$PRIVATE_KEY" > private-key.pem

          node <<EOF
          const fs = require("fs");
          const jwt = require("jsonwebtoken");
          const fetch = (...args) => import("node-fetch").then(({default: fetch}) => fetch(...args));

          const APP_ID = process.env.APP_ID;
          const INSTALLATION_ID = process.env.INSTALLATION_ID;
          const PRIVATE_KEY = fs.readFileSync("private-key.pem");

          const jwtToken = jwt.sign(
            {
              iat: Math.floor(Date.now() / 1000) - 60,
              exp: Math.floor(Date.now() / 1000) + (10 * 60),
              iss: APP_ID,
            },
            PRIVATE_KEY,
            { algorithm: "RS256" }
          );

          async function run() {
            const res = await fetch(
              \`https://api.github.com/app/installations/\${INSTALLATION_ID}/access_tokens\`,
              {
                method: "POST",
                headers: {
                  Authorization: \`Bearer \${jwtToken}\`,
                  Accept: "application/vnd.github+json",
                },
              }
            );

            const data = await res.json();
            console.log("Access Token:", data.token);

            const repoRes = await fetch(
              \`https://api.github.com/repos/\${process.env.REPO}/contents\`,
              {
                headers: {
                  Authorization: \`token \${data.token}\`,
                },
              }
            );

            const repoData = await repoRes.json();
            console.log("Repo Files:", repoData);
          }

          run();
          EOF


       

     
